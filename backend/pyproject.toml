[project]
name = "job-pipeline-backend"
version = "0.1.0"
description = "FastAPI backend for the AI job pipeline."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
]
