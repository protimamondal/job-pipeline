name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # A build must not need a real key. If this ever becomes a real
          # secret, a provider client is being constructed at build time
          # instead of per request.
          OPENAI_API_KEY: dummy-key-for-build
          MCP_SERVER_URL: http://127.0.0.1:8001/mcp

  mcp-server:
    name: MCP server (install, compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile check
        run: uv run python -m compileall -q server.py main.py

      - name: Import check
        run: uv run python -c "import server; print('server module imports cleanly')"
