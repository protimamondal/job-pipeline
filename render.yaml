databases:
  - name: job-pipeline-db
    plan: free
    databaseName: job_pipeline
    user: job_pipeline
    postgresMajorVersion: "17"

services:
  - type: web
    name: job-pipeline-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JOB_PIPELINE_ENVIRONMENT
        value: production
      # Render hands out postgresql://; Settings.normalise_database_url
      # rewrites it to the asyncpg driver, so this needs no editing.
      - key: JOB_PIPELINE_DATABASE_URL
        fromDatabase:
          name: job-pipeline-db
          property: connectionString
      - key: JOB_PIPELINE_REDIS_URL
        fromService:
          name: job-pipeline-cache
          type: keyvalue
          property: connectionString
      # Not fromService: the setting needs a full URL with the /mcp path, and
      # Render cannot build a string out of a service reference. Set it in the
      # dashboard once the MCP service is live, as
      # https://job-pipeline-mcp.onrender.com/mcp
      - key: JOB_PIPELINE_MCP_SERVER_URL
        sync: false
      # Set in the dashboard, not here: a secret in the blueprint is a secret
      # in git. `sync: false` makes Render prompt for it on first deploy.
      - key: JOB_PIPELINE_JWT_SECRET
        sync: false
      - key: JOB_PIPELINE_OPENAI_API_KEY
        sync: false
      # The deployed frontend's origin, e.g. https://job-pipeline.vercel.app
      - key: JOB_PIPELINE_CORS_ORIGINS
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false

  - type: web
    name: job-pipeline-mcp
    runtime: docker
    rootDir: mcp-server
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          name: job-pipeline-cache
          type: keyvalue
          property: connectionString

  # Cache only. Nothing here is the source of truth, so the free plan's lack
  # of persistence is survivable: a restart loses the job-search cache and the
  # in-flight rate-limit counters, and both rebuild on the next request.
  - type: keyvalue
    name: job-pipeline-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    # Empty means no public access: only other services in this Render
    # workspace can reach it, over the private network.
    ipAllowList: []
